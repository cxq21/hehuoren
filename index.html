<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#8cc63f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>种地吧 · 禾伙人等级测试</title>
<style>:root{--green:#5aa832;--deep:#2f6b1e;--leaf:#8cc63f;--wheat:#f2c14e;--gold:#e0a526;--cream:#fffaf0;--soil:#8a5a33;--text:#3b3a2a;--muted:#8b866e;--red:#e0574f;--radius:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;color:var(--text);
  background:linear-gradient(180deg,#bfe6ff 0%,#e9f7ff 30%,#fff6dc 62%,#f6e2a8 100%) fixed;min-height:100vh}
#app{max-width:520px;margin:0 auto;padding:0 14px calc(24px + env(safe-area-inset-bottom))}
.screen{display:none;animation:fadeIn .35s ease}
.screen.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hidden{display:none!important}
.card{background:rgba(255,253,245,.94);border-radius:var(--radius);padding:18px 16px;margin:14px 0;box-shadow:0 6px 18px rgba(120,100,30,.12),0 0 0 2px rgba(242,193,78,.25) inset}
h1{margin:6px 0 4px;font-size:34px;color:var(--deep);letter-spacing:2px;text-align:center;line-height:1.2}
h1 span{display:block;font-size:20px;color:var(--gold);letter-spacing:4px;margin-top:4px}
h3{margin:0 0 12px;font-size:17px;color:var(--deep)}
.hero{height:230px;margin:0 -14px;position:relative;overflow:hidden}
.hero svg{width:100%;height:100%;display:block}
.start-card{margin-top:-34px;position:relative;text-align:center}
.title-badge{display:inline-block;background:var(--deep);color:#fff6d0;font-size:12px;padding:4px 12px;border-radius:99px;letter-spacing:2px}
.sub{color:var(--muted);font-size:14px;line-height:1.7;margin:8px 0 14px}
.member-strip{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:4px 0 16px}
.mchip{display:inline-flex;align-items:center;gap:3px;font-size:12.5px;padding:4px 9px 4px 6px;border-radius:99px;color:#fff;font-weight:600;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.mchip i{font-style:normal;font-size:14px;background:rgba(255,255,255,.85);border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center}
.field{display:block;text-align:left;margin:0 0 14px}
.field span{font-size:13px;color:var(--muted)}
.field input,.field textarea{width:100%;margin-top:6px;font-size:16px;padding:12px 14px;border:2px solid #eadbb0;border-radius:12px;background:#fffdf6;color:var(--text);outline:none;font-family:inherit}
.field input:focus,.field textarea:focus{border-color:var(--leaf)}
.btn{border:0;border-radius:14px;font-size:16px;font-weight:700;padding:12px 18px;cursor:pointer;font-family:inherit;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.big{width:100%;padding:15px;font-size:18px}
.btn.primary{background:linear-gradient(180deg,#7cc243,#4f9a2a);color:#fff;box-shadow:0 4px 0 #3a7a1d}
.btn.primary:disabled{background:#c9cdb8;box-shadow:0 4px 0 #a9ad98;color:#f4f4ec}
.btn.secondary{background:linear-gradient(180deg,#ffd76a,#f0b43a);color:#5b3d05;box-shadow:0 4px 0 #c98f1d}
.btn.ghost{background:#f3ecd6;color:var(--soil)}
.best{margin-top:12px;font-size:13px;color:var(--gold);min-height:18px}
.links{margin-top:8px;font-size:13px;color:var(--muted)}
.link{background:none;border:0;color:var(--deep);font-size:14px;text-decoration:underline;cursor:pointer;padding:6px;font-family:inherit}
.foot{text-align:center;font-size:11px;color:#a59c7c;margin:10px 0 0}
/* quiz */
.quiz-top{display:flex;align-items:center;gap:10px;padding-top:calc(12px + env(safe-area-inset-top))}
.icon-btn{width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.8);font-size:26px;line-height:30px;color:var(--deep);cursor:pointer}
.progress{flex:1;height:12px;background:rgba(255,255,255,.7);border-radius:99px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.1)}
.progress .bar{height:100%;width:0;background:linear-gradient(90deg,var(--leaf),var(--wheat));border-radius:99px;transition:width .4s}
.count{font-weight:700;color:var(--deep);font-size:14px;min-width:42px;text-align:right}
.field-row{display:flex;align-items:flex-end;gap:12px;margin-top:8px}
.plant-box{width:92px;height:110px;flex:none}
.plant-box svg,.r-plant svg{width:100%;height:100%;overflow:visible}
.growth{flex:1;padding-bottom:10px}
.stage-name{font-size:20px;font-weight:800;color:var(--deep)}
.score-pill{display:inline-block;margin-top:6px;background:#fff;border-radius:99px;padding:4px 12px;font-size:13px;color:var(--muted)}
.score-pill b{color:var(--green);font-size:16px}
.q-card{margin-top:6px}
.q-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tag{background:#eaf5dc;color:var(--deep);font-size:12px;padding:3px 10px;border-radius:99px;font-weight:700}
.stars{color:var(--gold);font-size:13px;letter-spacing:1px}
.qtype{font-size:12px;color:var(--muted)}
.q-text{font-size:19px;font-weight:700;line-height:1.55;margin-bottom:14px}
.options{display:grid;gap:10px}
.options.tf{grid-template-columns:1fr 1fr}
.options.who{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fffdf7;border:2px solid #eee0b8;border-radius:14px;padding:13px 14px;font-size:16px;color:var(--text);cursor:pointer;font-family:inherit;line-height:1.4;transition:background .15s,border-color .15s,transform .08s;position:relative}
.opt:active{transform:scale(.98)}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;background:#f4e9c6;color:var(--soil);font-weight:800;display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.opt.tfbtn{justify-content:center;font-size:22px;font-weight:800;padding:18px}
.opt.member{flex-direction:column;justify-content:center;text-align:center;padding:12px 8px;gap:6px;font-weight:700}
.opt.member .av{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.opt.correct{background:#e5f6d4;border-color:#6cbf3a}
.opt.correct .k{background:#6cbf3a;color:#fff}
.opt.wrong{background:#fde7e3;border-color:var(--red)}
.opt.wrong .k{background:var(--red);color:#fff}
.opt.dim{opacity:.55}
.opt[disabled]{cursor:default}
.opt.picked .k{background:var(--leaf);color:#fff}
.order-actions{display:flex;gap:10px;margin-top:12px}
.order-actions .btn{flex:1}
.feedback{margin-top:14px;padding:14px;border-radius:14px;background:#f7f3e3;animation:fadeIn .3s}
.fb-head{font-size:18px;font-weight:800;margin-bottom:6px}
.fb-head.ok{color:#3f9a1f}.fb-head.no{color:var(--red)}
.fb-exp{font-size:14.5px;line-height:1.65;color:#5d5944;margin-bottom:12px}
.feedback .btn{width:100%}
.pop{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
/* result */
.result-card{text-align:center;padding-top:22px;margin-top:calc(16px + env(safe-area-inset-top));background:radial-gradient(circle at 50% 0%,#fff6cf,rgba(255,253,245,.96) 60%)}
.r-plant{width:120px;height:140px;margin:0 auto}
.r-level-emoji{font-size:30px;margin-top:-4px}
.r-stage{color:var(--gold);font-weight:700;letter-spacing:3px;font-size:14px}
.r-level{margin:4px 0 8px;font-size:30px;color:var(--deep)}
.r-score b{font-size:46px;color:var(--green)}
.r-score span{font-size:20px;color:var(--muted)}
.r-desc{color:#6b6650;line-height:1.7;font-size:14.5px;margin:6px 4px}
.r-best{font-size:13px;color:var(--gold);margin-top:6px}
.dedication{background:linear-gradient(135deg,#fff3f3,#fffaf0);box-shadow:0 6px 18px rgba(200,90,90,.12),0 0 0 2px rgba(240,150,150,.3) inset}
.ded-title{font-weight:800;color:#c4566a;margin-bottom:8px}
.ded-text{font-size:16px;line-height:1.8;white-space:pre-wrap;color:#6a4b4b}
.fav{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.fav .av{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff;flex:none;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.fav .t{font-size:14px;color:var(--muted);line-height:1.6}
.fav .t b{font-size:20px;color:var(--text)}
.member-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.mcell{text-align:center;font-size:11.5px}
.mcell .av{width:40px;height:40px;margin:0 auto 4px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;position:relative}
.mcell .pct{font-weight:800;font-size:12px}
.cat-row{margin-bottom:10px}
.cat-row .lab{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.cat-row .track{height:10px;background:#f1e8cc;border-radius:99px;overflow:hidden}
.cat-row .fill{height:100%;background:linear-gradient(90deg,var(--leaf),var(--wheat));border-radius:99px;width:0;transition:width .8s}
.actions{display:grid;gap:12px;margin:16px 0}
.home-link{display:block;margin:4px auto 10px}
details summary{cursor:pointer;font-weight:700;color:var(--deep);font-size:15px}
.rv{border-top:1px dashed #e6d9b0;padding:10px 0;font-size:14px;line-height:1.6}
.rv .rq{font-weight:700}.rv .ra{color:#3f9a1f}.rv .rx{color:var(--red)}.rv .re{color:var(--muted);font-size:13px}
.rv a{color:#a99f7c;font-size:12px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(40,35,10,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;animation:fadeIn .2s}
.modal-box{background:var(--cream);border-radius:20px;max-width:480px;width:100%;max-height:92vh;overflow:auto;padding:20px 16px 18px;position:relative}
.modal-x{position:absolute;right:10px;top:8px;border:0;background:none;font-size:28px;color:var(--muted);cursor:pointer}
.modal-box h3{text-align:center;margin-top:0}
.lv-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed #eadfbd}
.lv-row .e{font-size:26px;width:36px;text-align:center}
.lv-row .n{font-weight:800;color:var(--deep)}
.lv-row .r{font-size:12px;color:var(--muted)}
.cert-img{width:100%;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.18);display:block}
.hint{font-size:12.5px;color:var(--muted);text-align:center;margin:10px 0}
.modal .btn{width:100%;margin-top:8px}
@media (min-width:700px){body{padding-top:10px}.hero{border-radius:24px;margin:10px 0 0}}
</style>
</head>
<body>
<div id="app">

<!-- 开始页 -->
<section id="start" class="screen active">
  <div class="hero" id="heroScene"></div>
  <div class="card start-card">
    <div class="title-badge">十个勤天 · 做大做强</div>
    <h1>种地吧<span>禾伙人等级测试</span></h1>
    <p class="sub">20 道题，从后陡门的第一粒种子，到金灿灿的丰收。<br>测测你是几级禾伙人？</p>
    <div class="member-strip" id="memberStrip"></div>
    <label class="field">
      <span>你的昵称（选填，会写在证书上）</span>
      <input id="nick" maxlength="12" placeholder="例如：后陡门编外人员" autocomplete="off">
    </label>
    <button class="btn primary big" id="btnStart">开始下地 🌾</button>
    <div class="best" id="bestLine"></div>
    <div class="links">
      <button class="link" id="btnLevels">等级说明</button>
      <span>·</span>
      <button class="link" id="btnSettings">⚙️ 给TA的话</button>
    </div>
  </div>
  <p class="foot">非官方粉丝小游戏 · 题目均整理自公开报道与资料</p>
</section>

<!-- 答题页 -->
<section id="quiz" class="screen">
  <div class="quiz-top">
    <button class="icon-btn" id="btnQuit" aria-label="返回">‹</button>
    <div class="progress"><div class="bar" id="progBar"></div></div>
    <div class="count" id="progText">1/20</div>
  </div>
  <div class="field-row">
    <div class="plant-box" id="plantBox"></div>
    <div class="growth">
      <div class="stage-name" id="stageName">播种期</div>
      <div class="score-pill">答对 <b id="scoreNow">0</b> 题</div>
    </div>
  </div>
  <div class="card q-card" id="qCard">
    <div class="q-meta"><span class="tag" id="qCat"></span><span class="stars" id="qDiff"></span><span class="qtype" id="qType"></span></div>
    <div class="q-text" id="qText"></div>
    <div class="options" id="opts"></div>
    <div class="order-actions hidden" id="orderActions">
      <button class="btn ghost" id="btnOrderReset">重排</button>
      <button class="btn primary" id="btnOrderOk" disabled>确定顺序</button>
    </div>
    <div class="feedback hidden" id="feedback">
      <div class="fb-head" id="fbHead"></div>
      <div class="fb-exp" id="fbExp"></div>
      <button class="btn primary" id="btnNext">下一题 →</button>
    </div>
  </div>
</section>

<!-- 结果页 -->
<section id="result" class="screen">
  <div class="card result-card">
    <div class="r-plant" id="rPlant"></div>
    <div class="r-level-emoji" id="rEmoji"></div>
    <div class="r-stage" id="rStage"></div>
    <h2 class="r-level" id="rLevel"></h2>
    <div class="r-score"><b id="rScore">0</b><span>/20</span></div>
    <p class="r-desc" id="rDesc"></p>
    <div class="r-best" id="rBest"></div>
  </div>
  <div class="card dedication hidden" id="dedicationCard">
    <div class="ded-title">💌 给你的话</div>
    <div class="ded-text" id="dedicationText"></div>
  </div>
  <div class="card">
    <h3>💚 你最懂的少年</h3>
    <div class="fav" id="favMember"></div>
    <div class="member-grid" id="memberGrid"></div>
  </div>
  <div class="card">
    <h3>📊 分类正确率</h3>
    <div id="catStats"></div>
  </div>
  <div class="actions">
    <button class="btn primary big" id="btnCert">生成禾伙人等级证书 📜</button>
    <button class="btn secondary big" id="btnRetry">换一套题再来 🔁</button>
  </div>
  <div class="card">
    <details id="reviewBox"><summary>📖 查看本局题目回顾</summary><div id="review"></div></details>
  </div>
  <button class="link home-link" id="btnHome">回到首页</button>
</section>

</div>

<!-- 弹窗 -->
<div class="modal hidden" id="modal">
  <div class="modal-box">
    <button class="modal-x" id="modalX" aria-label="关闭">×</button>
    <div id="modalBody"></div>
  </div>
</div>

/* 稻子生长：stage 0..5 对应六个等级 */
function plantSVG(stage){
  var s='<svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">';
  s+='<ellipse cx="50" cy="112" rx="40" ry="8" fill="#8a5a33"/><ellipse cx="50" cy="109" rx="34" ry="5" fill="#a5703f"/>';
  if(stage===0){
    s+='<ellipse cx="50" cy="104" rx="7" ry="5" fill="#c9923e"/><path d="M50 100 q3 -6 0 -10" stroke="#8cc63f" stroke-width="3" fill="none" stroke-linecap="round"/>';
  } else {
    var H=[0,30,52,72,86,94][stage], top=108-H, stemC = stage>=5?'#b9a33a':'#5aa832', leafC=stage>=5?'#c8b448':'#6dbb3a';
    // 三根茎
    s+='<path d="M50 108 Q50 '+(108-H/2)+' 50 '+top+'" stroke="'+stemC+'" stroke-width="3.5" fill="none" stroke-linecap="round"/>';
    if(stage>=2){ s+='<path d="M47 108 Q40 '+(108-H/2)+' 36 '+(top+12)+'" stroke="'+stemC+'" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M53 108 Q60 '+(108-H/2)+' 64 '+(top+12)+'" stroke="'+stemC+'" stroke-width="3" fill="none" stroke-linecap="round"/>'; }
    // 叶子
    var nLeaf = stage===1?2:stage===2?4:6;
    for(var i=0;i<nLeaf;i++){
      var y=104-i*(H/(nLeaf+1)), dir=i%2?1:-1, len=16+Math.min(i,3)*3;
      var n=function(v){ return (+v.toFixed(2)); };
      s+='<path d="M50 '+n(y)+' q'+n(dir*len*0.6)+' '+n(-len*0.5)+' '+n(dir*len)+' '+n(-len*0.2)+' q'+n(-dir*len*0.5)+' 0 '+n(-dir*len)+' '+n(len*0.2)+'z" fill="'+leafC+'"/>';
    }
    // 穗
    if(stage>=3){
      var tops=[[50,top],[36,top+12],[64,top+12]];
      tops.forEach(function(t,k){
        if(stage===3 && k>0) return;
        var c = stage===3?'#9ccf5a':stage===4?'#d9cf5a':'#f2b934', droop = stage>=5?1:0;
        var n = stage===3?3:stage===4?5:6;
        for(var j=0;j<n;j++){
          var gx=t[0]+(droop? (k===2?1:-1)*j*1.8 : 0), gy=t[1]-4-j*4+(droop?j*2.6:0);
          s+='<ellipse cx="'+(gx-2.6)+'" cy="'+gy+'" rx="2.4" ry="4" fill="'+c+'" transform="rotate(-20 '+(gx-2.6)+' '+gy+')"/><ellipse cx="'+(gx+2.6)+'" cy="'+gy+'" rx="2.4" ry="4" fill="'+c+'" transform="rotate(20 '+(gx+2.6)+' '+gy+')"/>';
        }
      });
    }
    if(stage>=5){ s+='<g fill="#ffe27a"><circle cx="18" cy="30" r="2"/><circle cx="84" cy="22" r="2.5"/><circle cx="80" cy="50" r="1.6"/><circle cx="22" cy="58" r="1.6"/></g>'; }
  }
  return s+'</svg>';
}

/* ---------------- 抽题 ---------------- */
function drawSet(){
  var seen = lsGet(LS.seen, []);
  var seenSet = {}; seen.forEach(function(id){ seenSet[id]=1; });
  var pool = shuffle(BANK).sort(function(a,b){ return (seenSet[a.id]?1:0)-(seenSet[b.id]?1:0); }); // 优先没做过的
  var quota = {1:6, 2:9, 3:5};
  var picked = [], used = {};
  function canTake(q){ return !used[q.id] && quota[q.diff]>0; }
  function take(q){ picked.push(q); used[q.id]=1; quota[q.diff]--; }
  // 1) 每位少年至少一道
  shuffle(MEMBERS).forEach(function(m){
    if(picked.some(function(p){ return p.members.indexOf(m.name)>=0; })) return;
    var c = pool.filter(function(q){ return canTake(q) && q.members.indexOf(m.name)>=0 && q.members.length<=2; })[0];
    if(c) take(c);
  });
  // 2) 题型保底：排序1、判断2、谁做的3
  var need = {order:1, tf:2, who:3};
  Object.keys(need).forEach(function(t){
    var have = picked.filter(function(p){return p.type===t;}).length;
    pool.forEach(function(q){ if(have<need[t] && q.type===t && canTake(q)){ take(q); have++; } });
  });
  // 3) 分类保底：每类至少2道
  ['节目大事件','农事知识','少年档案','名场面','十个勤天日常'].forEach(function(c){
    var have = picked.filter(function(p){return p.cat===c;}).length;
    pool.forEach(function(q){ if(have<2 && q.cat===c && canTake(q)){ take(q); have++; } });
    pool.forEach(function(q){ if(have<2 && q.cat===c && !used[q.id]){ take(q); have++; } }); // 难度配额不够时也要保底
  });
  // 4) 补满（控制排序题≤2，谁做的≤6）
  pool.forEach(function(q){
    if(picked.length>=N_Q || !canTake(q)) return;
    var cnt = picked.filter(function(p){return p.type===q.type;}).length;
    if((q.type==='order'&&cnt>=2)||(q.type==='who'&&cnt>=6)||(q.type==='tf'&&cnt>=3)) return;
    take(q);
  });
  pool.forEach(function(q){ if(picked.length<N_Q && !used[q.id]){ picked.push(q); used[q.id]=1; } });
  // 难度递增，同难度内随机
  picked = shuffle(picked).sort(function(a,b){ return a.diff-b.diff; });
  // 记录已出过的题
  var newSeen = seen.concat(picked.map(function(p){return p.id;}));
  if(newSeen.length > BANK.length - N_Q) newSeen = newSeen.slice(-(BANK.length - N_Q*2));
  lsSet(LS.seen, newSeen);
  return picked;
}

function onPick(btn, k){
  if(S.answered) return;
  var q=S.qs[S.i];
  if(q.type==='order'){
    var p=S.order.indexOf(k);
    if(p>=0) return;
    S.order.push(k); btn.classList.add('picked'); btn.querySelector('.k').textContent=S.order.length;
    $('btnOrderOk').disabled = S.order.length<q.options.length;
    return;
  }
  finish(k===q.answer, k);
}
function orderReset(){ if(S.answered) return; S.order=[]; Array.prototype.forEach.call($('opts').children,function(b){ b.classList.remove('picked'); b.querySelector('.k').textContent=''; }); $('btnOrderOk').disabled=true; }
function orderOk(){
  var q=S.qs[S.i]; if(S.answered||S.order.length<q.options.length) return;
  var ok = S.order.every(function(k,i){ return k===q.answer[i]; });
  finish(ok, S.order.slice());
}

function finish(ok, picked){
  var q=S.qs[S.i]; S.answered=true;
  if(ok) S.score++;
  S.log.push({q:q, ok:ok, picked:picked});
  Array.prototype.forEach.call($('opts').children,function(b){
    var k=+b.dataset.k; b.disabled=true;
    if(q.type==='order'){
      var pos=q.answer.indexOf(k);
      b.querySelector('.k').textContent=pos+1;
      b.classList.add(ok?'correct':(S.order.indexOf(k)===pos?'correct':'wrong'));
    } else if(k===q.answer) b.classList.add('correct');
    else if(k===picked) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  if(q.type==='order'){ // 按正确顺序重新排列
    var box=$('opts'); var arr=Array.prototype.slice.call(box.children);
    arr.sort(function(a,b){ return q.answer.indexOf(+a.dataset.k)-q.answer.indexOf(+b.dataset.k); }).forEach(function(b){ box.appendChild(b); });
  }
  var head=$('fbHead');
  var praise=['答对啦！🌾','漂亮！不愧是禾伙人 👏','正确！又长高一截 🌱','对啦！做大做强！💪','完全正确 ✨'];
  var comfort=['差一点点～ 🍂','没关系，土地会给答案 🌧️','这题有点难，记住啦 📒','下次一定！🌱'];
  head.textContent= ok? praise[Math.floor(Math.random()*praise.length)] : comfort[Math.floor(Math.random()*comfort.length)];
  head.className='fb-head '+(ok?'ok':'no');
  var ans = q.type==='order' ? q.answer.map(function(k){return q.options[k];}).join(' → ') : q.options[q.answer];
  $('fbExp').innerHTML=(ok?'':'正确答案：<b>'+esc(ans)+'</b><br>')+esc(q.explain);
  $('btnNext').textContent = S.i===N_Q-1 ? '看看我的等级 🏅' : '下一题 →';
  $('feedback').classList.remove('hidden');
  $('orderActions').classList.add('hidden');
  $('scoreNow').textContent=S.score;
  $('qCard').classList.remove('shake'); void $('qCard').offsetWidth; if(!ok) $('qCard').classList.add('shake');
  updatePlant(ok);
  setTimeout(function(){ var f=$('feedback'); if(f.scrollIntoView) f.scrollIntoView({behavior:'smooth',block:'nearest'}); },60);
}

/* ---------------- 结果 ---------------- */
function computeStats(){
  var cats={}, mem={};
  MEMBERS.forEach(function(m){ mem[m.name]={ok:0,n:0}; });
  S.log.forEach(function(r){
    var c=cats[r.q.cat]||(cats[r.q.cat]={ok:0,n:0}); c.n++; if(r.ok) c.ok++;
    r.q.members.forEach(function(m){ mem[m].n++; if(r.ok) mem[m].ok++; });
  });
  var fav=null;
  MEMBERS.forEach(function(m){
    var x=mem[m.name]; if(!x.n) return;
    var sc=x.ok/x.n + x.ok*0.01;
    if(!fav || sc>fav.sc) fav={name:m.name, sc:sc, ok:x.ok, n:x.n};
  });
  return {cats:cats, mem:mem, fav:fav};
}
function showResult(){

/* ---------------- 证书 ---------------- */
function roundRect(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function drawWheat(c,x,y,h,ang,col){
  c.save(); c.translate(x,y); c.rotate(ang);
  c.strokeStyle='#c99a2e'; c.lineWidth=4; c.beginPath(); c.moveTo(0,0); c.quadraticCurveTo(6,-h/2,0,-h); c.stroke();
  c.fillStyle=col||'#f2c14e';
  for(var i=0;i<6;i++){ var yy=-h+10+i*14;
    c.save(); c.translate(-6,yy); c.rotate(-0.45); c.beginPath(); c.ellipse(0,0,6,13,0,0,Math.PI*2); c.fill(); c.restore();
    c.save(); c.translate(6,yy); c.rotate(0.45); c.beginPath(); c.ellipse(0,0,6,13,0,0,Math.PI*2); c.fill(); c.restore(); }
  c.beginPath(); c.ellipse(0,-h-6,6,14,0,0,Math.PI*2); c.fill();
  c.restore();
}
function fitText(c,text,maxW,size,weight){
  var s=size; c.font=weight+' '+s+'px "PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif';
  while(c.measureText(text).width>maxW && s>20){ s-=2; c.font=weight+' '+s+'px "PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif'; }
}
function makeCert(){
  var cv=$('certCanvas'), c=cv.getContext('2d'), W=1080, H=1500, F='"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif';

  // 光芒
  c.save(); c.translate(W/2,360); c.fillStyle='rgba(255,215,90,.18)';
  for(var i=0;i<24;i++){ c.rotate(Math.PI/12); c.beginPath(); c.moveTo(0,0); c.lineTo(-40,-900); c.lineTo(40,-900); c.closePath(); c.fill(); }
  c.restore();
  // 边框

  c.lineWidth=3; c.strokeStyle='#e0a526'; roundRect(c,60,60,W-120,H-120,30); c.stroke();
  // 角落麦穗
  drawWheat(c,110,1420,170,-0.35); drawWheat(c,150,1430,150,-0.1,'#e8b33c'); drawWheat(c,970,1420,170,0.35); drawWheat(c,930,1430,150,0.1,'#e8b33c');
  drawWheat(c,120,250,120,-0.6); drawWheat(c,960,250,120,0.6);
  // 田地
  c.fillStyle='#a6d86a'; c.beginPath(); c.moveTo(60,1330); c.quadraticCurveTo(540,1250,1020,1330); c.lineTo(1020,1420); c.lineTo(60,1420); c.fill();
  // 标题
  c.textAlign='center'; c.textBaseline='alphabetic';
  c.fillStyle='#e0a526'; c.font='600 34px '+F; c.fillText('—  种 地 吧  ·  禾 伙 人  —',W/2,170);
  c.fillStyle='#2f6b1e'; c.font='900 92px '+F; c.fillText('禾伙人等级证书',W/2,280);
  // 稻子
  var img=new Image();
  var svg=plantSVG(levelIdx(S.score)).replace('<svg ','<svg width="300" height="360" ');
  img.onload=function(){
    c.drawImage(img,W/2-150,300,300,360);
    finishCert(c,W,H,F,L,st,nick);
  };
  img.onerror=function(){ finishCert(c,W,H,F,L,st,nick); };
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
function finishCert(c,W,H,F,L,st,nick){
  c.textAlign='center';
  c.fillStyle='#6b6650'; c.font='500 40px '+F; c.fillText('兹证明',W/2,730);
  fitText(c,nick,820,78,'900'); c.fillStyle='#3b3a2a'; c.fillText(nick,W/2,830);
  c.strokeStyle='#e0a526'; c.lineWidth=3; c.beginPath(); c.moveTo(W/2-300,858); c.lineTo(W/2+300,858); c.stroke();
  c.fillStyle='#6b6650'; c.font='500 38px '+F; c.fillText('在「种地吧禾伙人等级测试」中答对 '+S.score+' / 20 题，荣获',W/2,930);
  // 等级牌
  var bw=760,bh=170,bx=(W-bw)/2,by=965;
  var gg=c.createLinearGradient(0,by,0,by+bh); gg.addColorStop(0,'#7cc243'); gg.addColorStop(1,'#4f9a2a');
  c.fillStyle=gg; roundRect(c,bx,by,bw,bh,36); c.fill();
  c.fillStyle='#fff6d0'; c.font='700 36px '+F; c.fillText(L.emoji+'  '+L.stage,W/2,by+56);
  c.fillStyle='#fff'; c.font='900 82px '+F; c.fillText(L.name,W/2,by+142);
  // 最懂的少年
  var fav=st.fav;
  c.font='500 36px '+F; c.fillStyle='#6b6650';
  if(fav && fav.ok>0){
    c.fillText('最懂的少年：',W/2-60,1210);
    c.fillStyle=MCOLOR[fav.name]; c.font='800 40px '+F; c.textAlign='left'; c.fillText(MICON[fav.name]+' '+fav.name,W/2+50,1210); c.textAlign='center';
  }
  c.fillStyle='#2f6b1e'; c.font='800 40px '+F; c.fillText('十个勤天，做大做强！',W/2,1272);
  c.fillStyle='#8b866e'; c.font='500 30px '+F; c.fillText('颁发日期：'+today(),W/2,1380);
  // 印章
  c.save(); c.translate(870,1345); c.rotate(-0.2); c.strokeStyle='rgba(214,69,90,.85)'; c.lineWidth=7; c.beginPath(); c.arc(0,0,84,0,Math.PI*2); c.stroke();
  c.lineWidth=2; c.beginPath(); c.arc(0,0,72,0,Math.PI*2); c.stroke();
  c.fillStyle='rgba(214,69,90,.85)'; c.font='900 34px '+F; c.fillText('禾伙人',0,-6); c.font='700 24px '+F; c.fillText('认证 ★',0,30); c.restore();
  var url;
  try{ url=$('certCanvas').toDataURL('image/png'); }catch(e){ url=null; }
  S.certURL=url;
  openModal('<h3>📜 你的禾伙人等级证书</h3>'+(url?'<img class="cert-img" id="certImg" alt="禾伙人等级证书" src="'+url+'">':'<p>证书生成失败</p>')+
    '<p class="hint">手机上可以 <b>长按图片</b> 保存到相册，或点下面的按钮下载</p>'+
    '<button class="btn primary" id="btnDl">下载 PNG 图片 ⬇️</button>');
  $('btnDl').addEventListener('click', downloadCert);
}
function downloadCert(){
  var cv=$('certCanvas'), name='禾伙人等级证书-'+(S.nick||'禾伙人')+'.png';
  function go(href){ var a=document.createElement('a'); a.href=href; a.download=name; document.body.appendChild(a); a.click(); setTimeout(function(){ document.body.removeChild(a); },100); }
  if(cv.toBlob){ cv.toBlob(function(b){ if(!b){ go(S.certURL); return; } var u=URL.createObjectURL(b); go(u); setTimeout(function(){URL.revokeObjectURL(u);},4000); },'image/png'); }
  else go(S.certURL);
}

/* ---------------- 弹窗 / 设置 ---------------- */
function openModal(html){ $('modalBody').innerHTML=html; $('modal').classList.remove('hidden'); }
function closeModal(){ $('modal').classList.add('hidden'); }
function showLevels(){
  var h='<h3>🌾 禾伙人等级</h3><p class="hint">一局 20 题，按答对题数评级，稻子也会跟着长大</p>';
  LEVELS.forEach(function(l,i){ var max=i<LEVELS.length-1?LEVELS[i+1].min-1:20;
    h+='<div class="lv-row"><div class="e">'+l.emoji+'</div><div><div class="n">'+l.stage+' · '+l.name+'</div><div class="r">答对 '+l.min+(max>l.min?'–'+max:'')+' 题</div></div></div>'; });
  openModal(h);
}
function showSettings(){
  openModal('<h3>⚙️ 给TA的话</h3><p class="hint">在这里写一句想对TA说的话，TA答完题会在结果页看到（只保存在这台设备上，留空则不显示）</p>'+
    '<label class="field"><textarea id="dedInput" rows="4" maxlength="120" placeholder="例如：你就是我心里的金牌禾伙人 💛"></textarea></label>'+
    '<button class="btn primary" id="btnDedSave">保存</button>');
  $('dedInput').value=getDedication();
  $('btnDedSave').addEventListener('click', function(){ lsSet(LS.ded, $('dedInput').value.trim()); closeModal(); });
}

/* ---------------- 初始化 ---------------- */
function init(){
  $('heroScene').innerHTML=heroSVG();
  var strip=$('memberStrip');
  MEMBERS.forEach(function(m){ var s=el('span','mchip','<i>'+m.icon+'</i>'+esc(m.name)); s.style.background=m.color; strip.appendChild(s); });
  $('nick').value=lsGet(LS.nick,'')||'';
  var best=lsGet(LS.best,null);
  $('bestLine').textContent= best ? '🏅 最好成绩：'+best.score+'/20 · '+best.level : '题库 '+BANK.length+' 题，每局随机抽 20 题';
  $('btnStart').addEventListener('click', startGame);
  $('btnNext').addEventListener('click', next);
  $('btnOrderReset').addEventListener('click', orderReset);
  $('btnOrderOk').addEventListener('click', orderOk);
  $('btnQuit').addEventListener('click', function(){ if(confirm('确定退出本局吗？进度不会保存。')){ init_home(); } });
  $('btnRetry').addEventListener('click', startGame);
  $('btnHome').addEventListener('click', init_home);
  $('btnCert').addEventListener('click', makeCert);
  $('btnLevels').addEventListener('click', showLevels);
  $('btnSettings').addEventListener('click', showSettings);
  $('modalX').addEventListener('click', closeModal);
  $('modal').addEventListener('click', function(e){ if(e.target===$('modal')) closeModal(); });
}
function init_home(){
  var best=lsGet(LS.best,null);
  $('bestLine').textContent= best ? '🏅 最好成绩：'+best.score+'/20 · '+best.level : '题库 '+BANK.length+' 题，每局随机抽 20 题';
  show('start');
}
window.ZD = { drawSet:drawSet, state:function(){return S;}, LEVELS:LEVELS };
init();
})();
</script>
